<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرغینو | مدیریت مرغداری</title>
<meta name="description" content="مرغینو — برنامه‌ی ساده‌ی مدیریت دوره‌ی پرورش مرغ گوشتی: هزینه‌ها، تلفات، دان، وزن‌کشی و نرخ تبدیل.">
<meta name="theme-color" content="#f08a28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مرغینو">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ورود -->
<section id="screen-login" class="screen">
  <div class="login-box">
    <img src="icons/icon-192.png" alt="مرغینو" class="logo" width="96" height="96">
    <h1>مرغینو</h1>
    <p class="muted" id="login-farm">مدیریت مرغداری</p>

    <div id="login-roles" class="role-grid">
      <button class="role-btn" data-role="manager">
        <span class="role-icon">👨‍💼</span>
        <span class="role-label">مدیر</span>
        <span class="role-hint">همه‌ی بخش‌ها</span>
      </button>
      <button class="role-btn" data-role="worker">
        <span class="role-icon">👷</span>
        <span class="role-label">کارگر</span>
        <span class="role-hint">ثبت روزانه</span>
      </button>
    </div>

    <div id="login-pin" class="pin-box hidden">
      <div class="pin-head">
        <button class="link-btn" id="pin-back">↻ تغییر کاربر</button>
        <strong id="pin-role-label"></strong>
      </div>
      <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="pin-error" id="pin-error"></div>
      <div class="keypad" id="keypad"></div>
      <label class="remember">
        <input type="checkbox" id="pin-remember" checked>
        <span>مرا به خاطر بسپار</span>
      </label>
      <p class="muted tiny">رمز پیش‌فرض مدیر ۱۲۳۴ و کارگر ۱۱۱۱ است. مدیر می‌تواند آن را در تنظیمات عوض کند.</p>
    </div>
  </div>
</section>

<!-- برنامه -->
<section id="screen-app" class="screen hidden">
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="منو">☰</button>
    <div class="topbar-title">
      <strong id="cycle-name">—</strong>
      <span id="cycle-sub" class="muted tiny">—</span>
    </div>
    <button class="icon-btn" id="btn-role" aria-label="کاربر">👤</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="money"><span class="tab-icon">💰</span><span>هزینه و درآمد</span></button>
    <button class="tab is-active" data-tab="report"><span class="tab-icon">📋</span><span>گزارش وضعیت</span></button>
    <button class="tab" data-tab="summary"><span class="tab-icon">📝</span><span>جمع‌بندی</span></button>
  </nav>
</section>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="js/jalali.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/notify.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
